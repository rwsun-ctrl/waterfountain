<!DOCTYPE html>
<html>
<body style="margin:0; overflow:hidden; background:#050510;">
<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const groundY = canvas.height * 0.82;

/* REPLACE THESE WITH YOUR IMAGE LINKS */

const imageLinks = [
  "https://i.postimg.cc/1RwQD1Yx/Water-(1).png"
];

/* load images */

const images = imageLinks.map(link => {
  const img = new Image();
  img.src = link;
  return img;
});

let particles = [];

/* create particles */

function spawnParticle() {

  particles.push({

    x: canvas.width / 2,
    y: groundY,

    z: Math.random() * 500,

    vx: (Math.random() - 0.5) * 6,

    vy: -Math.random() * 16 - 12,

    vz: (Math.random() - 0.5) * 6,

    img: images[Math.floor(Math.random() * images.length)],

    /* random larger sizes */

    size: Math.random() * 80 + 80,

    /* random rotation */

    angle: Math.random() * Math.PI * 2,

    /* random spinning speed */

    spin: (Math.random() - 0.5) * 0.1

  });

}

/* animation loop */

function animate() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* ground */

  ctx.fillStyle = "#222";

  ctx.fillRect(
    0,
    groundY,
    canvas.width,
    canvas.height - groundY
  );

  /* particles */

  for (let i = particles.length - 1; i >= 0; i--) {

    let p = particles[i];

    /* movement */

    p.x += p.vx;

    p.y += p.vy;

    p.z += p.vz;

    /* gravity */

    p.vy += 0.45;

    /* fake 3D scaling */

    let scale = 1 / (1 + p.z * 0.002);

    let size = p.size * scale;

    /* rotation */

    p.angle += p.spin;

    ctx.save();

    ctx.translate(p.x, p.y);

    ctx.rotate(p.angle);

    /* draw image */

    ctx.drawImage(
      p.img,
      -size / 2,
      -size / 2,
      size,
      size
    );

    ctx.restore();

    /* remove when touching ground */

    if (p.y >= groundY) {

      particles.splice(i, 1);

    }

  }

  /* spawn more */

  if (particles.length < 14) {

    spawnParticle();

  }

  requestAnimationFrame(animate);

}

animate();

</script>
</body>
</html>
